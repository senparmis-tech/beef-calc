<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>Beef Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receipts">
<style>
:root{--bg:#ebe7df;--card:#fff;--ink:#1d1b18;--mut:#7a746b;--line:#ddd6ca;--acc:#b3261e;--on:#fff;--key:#ece7de;--op:#d9cdb8;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161513;--card:#201e1b;--ink:#f1ede6;--mut:#9a9388;--line:#37332d;--acc:#ff6b61;--on:#161513;--key:#2d2a25;--op:#453f35}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:var(--on);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.22);color:inherit;border:0;border-radius:8px;padding:8px 9px;font:inherit;font-size:14px;cursor:pointer}
@media(max-width:380px){header .lg{display:none}header{gap:6px;padding-left:10px;padding-right:10px}}
main{max-width:560px;margin:0 auto;padding:12px 10px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.stat{display:flex;justify-content:space-between;align-items:end}.stat b{font-size:26px}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.li{display:flex;justify-content:space-between;gap:10px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li:active{background:var(--key)}
.li small{color:var(--mut);display:block}
.empty{text-align:center;color:var(--mut);padding:30px}
.pr{display:grid;grid-template-columns:1fr 90px 30px;gap:6px;border-bottom:1px solid var(--line)}
.pr input{font:inherit;color:inherit;background:transparent;border:0;padding:10px 2px;min-width:0;width:100%}.pr input:focus{outline:0;background:var(--key)}
.btn{border:1px solid var(--line);background:var(--key);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.btn.d{color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.x{background:none;border:0;color:#888;font-size:15px;cursor:pointer}
/* ---- paper receipt ---- */
.paper{--pen:#1b2a6b;background:#f6f3ec linear-gradient(#fbf9f4,#efeadf);color:#1a1a1a;border-radius:3px;padding:14px 10px 16px;box-shadow:0 2px 3px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.18);margin-bottom:12px;font-family:Georgia,"Times New Roman",serif}
.paper h2{margin:0 0 8px;text-align:center;font-size:15px;letter-spacing:3px}
.hw{font-family:"Segoe Print","Bradley Hand","Noto Sans Handwriting","Comic Sans MS","Marker Felt",cursive;color:var(--pen)}
.hl{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.hl b{font-size:12px;letter-spacing:.5px;white-space:nowrap;padding-bottom:3px}
.hl input{flex:1;border:0;border-bottom:1.5px solid #333;background:transparent;font-size:17px;padding:2px 4px;min-width:0;width:100%;border-radius:0}
.paper input{font:inherit;color:inherit}
.paper input:focus{outline:0;background:rgba(27,42,107,.09)}
table.rc{width:100%;border-collapse:collapse;table-layout:fixed;border:1.5px solid #333;margin-top:6px}
.rc th{font-size:11px;letter-spacing:.3px;padding:6px 1px;border:1.5px solid #333;background:rgba(0,0,0,.04)}
.rc td{border:1px solid #444;border-width:0 1.5px 1px;padding:0;height:44px;position:relative}
.rc td input{width:100%;height:100%;border:0;background:transparent;font-size:17px;padding:0 3px;min-width:0}
.rc td .am{display:block;text-align:right;padding:0 5px;font-size:16px;line-height:40px;white-space:nowrap;overflow:hidden}
.rc .c{text-align:center}.rc .r{text-align:right}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;align-items:flex-start}
.foot .l{font-size:11px;font-weight:bold;line-height:1.3}
.rno{color:#d22;font:22px/1 "Courier New",monospace;letter-spacing:1px;margin-top:8px;display:flex;align-items:center;gap:3px}
.rno span{color:#222;font:bold 14px Georgia,serif}
.rno input{border:0;background:transparent;color:#d22;font:22px "Courier New",monospace;width:130px;letter-spacing:1px;padding:0}
.tt{flex:1;max-width:210px}
.tt div{display:flex;align-items:flex-end;gap:6px;margin-bottom:4px}
.tt b{font-size:11px;white-space:nowrap;padding-bottom:3px}
.tt .v,.tt input{flex:1;border:0;border-bottom:1.5px solid #333;background:transparent;text-align:right;font-size:17px;padding:2px 3px;min-width:0;width:100%;border-radius:0}
.tt .g{font-size:19px;font-weight:bold}
.rc td input.req{background:rgba(210,40,40,.22)}
#warn{display:none;background:#fde7e5;color:#a1181a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.rc td input[data-k=a]{padding-right:22px}
.dd{position:absolute;right:0;top:0;height:100%;width:24px;border:0;background:transparent;color:#444;font-size:11px;cursor:pointer;padding:0}
.ddm{position:fixed;z-index:20;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:200px;max-height:50vh;overflow:auto;font-family:system-ui,sans-serif}
.ddm div{padding:12px 14px;display:flex;justify-content:space-between;gap:18px;cursor:pointer;border-bottom:1px solid var(--line)}
.ddm div:last-child{border:0}.ddm div:active{background:var(--key)}.ddm small{color:var(--mut);font-size:14px}
.bub{display:none;position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:#c62828;color:#fff;font:600 11px/1 system-ui,sans-serif;padding:6px 9px;border-radius:10px;white-space:nowrap;z-index:4;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#c62828}
.miss .bub{display:block}
.lk td{background:rgba(46,125,50,.12)}
.rc tr{scroll-margin-top:72px}
.rc td input[data-num]{caret-color:transparent}
.rc td input.act{background:rgba(27,42,107,.2)}
body.npo main{padding-bottom:380px}body.npo .fab{display:none}
#np .disp b{font-size:26px}
#np .keys button.e{grid-column:span 2}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.mdl .box{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sum{margin-top:12px;border-top:1.5px solid #333;padding-top:6px}
.sl{display:flex;align-items:baseline;gap:10px;padding:4px 0}
.sl b{font-size:12px;letter-spacing:.6px;white-space:nowrap;min-width:96px}
.sl .v,.sl input{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.sl .v{display:block;font-size:22px;font-weight:700}
.sl input{border:0;border-bottom:1.5px dashed #888;background:transparent;font-size:20px;padding:2px 4px;border-radius:0}
.sl.big{border-top:2px solid #222;margin-top:6px;padding-top:8px}.sl.big .v{font-size:30px}
.nb{display:none;justify-content:space-between;align-items:center;gap:8px;border-radius:8px;padding:6px 10px;margin:2px 0 4px;font:600 12px system-ui,sans-serif}
.nb button{border:0;background:#8a5a00;color:#fff;border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
.foot2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.stamp{display:table;margin:0 auto 8px;color:#1b7a34;border:2px solid #1b7a34;border-radius:6px;padding:2px 10px;font:700 12px system-ui,sans-serif;letter-spacing:1px;transform:rotate(-3deg)}
.paper input:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.rc tr.cur td{background:rgba(255,214,0,.22)}
body.kb main{padding-bottom:55vh}
.btn.big{padding:14px;font-size:16px;font-weight:700;width:100%}
.mdl .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}.mdl .col .btn{width:100%;padding:12px}
@media print{.nb{display:none!important}}
#cv{position:fixed;inset:0;z-index:25;background:#fbfaf6;color:#111;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cvh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid #111;gap:10px}
.cvt{font-size:24px;font-weight:800}.cvs{font-size:13px;color:#666}
.cvh button{border:0;background:#111;color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.cvl{flex:1;overflow-y:auto;padding:4px 16px}
.cvr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #ddd}
.cvn{width:24px;color:#999;font-size:15px;text-align:center}
.cvm{flex:1;min-width:0}.cva{font-size:22px;font-weight:700}.cvq{font-size:18px;color:#444;margin-top:2px;font-variant-numeric:tabular-nums}
.cvp{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cvk{color:#1b7a34;font-size:16px;margin-right:6px}
.cve{text-align:center;color:#888;padding:40px;font-size:18px}
.cvf{border-top:2px solid #111;padding:10px 16px 16px;background:#f1eee6}
.cvi{font-size:13px;color:#666;margin-bottom:6px}
.cvx{display:flex;align-items:baseline;gap:12px;padding:4px 0;font-size:16px}.cvx span{white-space:nowrap}
.cvx b{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;font-size:26px;font-variant-numeric:tabular-nums}
.cvg{border-top:2px solid #111;margin-top:6px;padding-top:8px}.cvg span{font-weight:800;letter-spacing:.5px}.cvg b{font-size:40px;color:#b3261e}
.hero{padding:16px}
.hero span{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.hero>b{display:block;font-size:38px;line-height:1.2;color:var(--acc);margin:2px 0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hero>small{display:block;color:var(--mut)}
.ol{margin-top:10px;border-top:1px solid var(--line)}
.or{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.or span{font-size:16px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.or span small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.or b{font-size:18px;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);margin:0 2px 10px}.sub b{color:var(--ink)}
.sq{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;margin-bottom:12px;font:inherit}
.pf{border:0;background:#1b7a34;color:#fff;border-radius:8px;padding:6px 9px;font:600 11px system-ui,sans-serif;white-space:nowrap;cursor:pointer;align-self:center}
@media print{.pf{display:none}}
.lg{height:30px;width:30px;border-radius:22%;vertical-align:middle;margin-right:8px}
.lg2{height:46px;width:46px;border-radius:22%;flex:none}
.plogo{display:block;margin:0 auto 6px;height:66px;width:66px;border-radius:22%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font:inherit;cursor:pointer}.chip:active{background:var(--op)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:6;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;max-width:420px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.sheet.o{transform:none}
.disp{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:right;margin-bottom:8px}.disp small{display:block;color:var(--mut);min-height:17px;word-break:break-all}.disp b{font-size:28px;font-weight:600;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{font:inherit;font-size:19px;border:0;border-radius:10px;padding:12px 0;background:var(--key);color:var(--ink);cursor:pointer}
.keys .o{background:var(--op)}.keys .e{background:var(--acc);color:var(--on)}.keys .c{color:var(--acc)}
.btn.p{background:var(--acc);color:var(--on);border-color:var(--acc)}
@media print{header,.fab,.sheet,.chips,.bar{display:none}body{background:#fff}.paper{box-shadow:none}}
</style></head><body>
<header id="hd"></header>
<main id="app"></main>
<button class="fab" id="fab" title="Calculator">🖩</button>
<div class="sheet" id="sh">
  <div class="disp"><small id="ex"></small><b id="cd">0</b></div>
  <div class="keys" id="keys"></div>
  <div class="bar"><button class="btn p" id="ins" style="flex:1">Insert into selected field</button><button class="btn" id="cls">Close</button></div>
</div>
<div class="sheet" id="np"><div class="disp"><small id="npt"></small><b id="npv">0</b></div><div class="keys" id="npk"></div></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const money=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=r=>r.s==='a'?Math.round(num(r.A)*100)/100:Math.round(num(r.q)*num(r.p)*100)/100;
const fn=(n,d)=>String(+n.toFixed(d));
const sub=rc=>rc.rows.reduce((s,r)=>s+amt(r),0);
const grand=rc=>sub(rc)+num(rc.bal);
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({q:'',u:'',a:'',p:''});
const R=(q,a,p)=>({q,u:'',a,p});

let db={items:[['Laman',390],['Pips',340],['Puso',260],['Isaw',260],['Pila',350],['Bulalo',310],['Padaitan',280]].map(a=>({n:a[0],p:a[1]})),receipts:[]};
db.receipts.push({id:1,no:'0343640',to:'Jackie',dt:'2026-11-14',ad:'',bal:183,rows:[R(5,'Laman',390),R(4.9,'Pips',340),R(5,'Laman',390),R(5,'Pips',340),R(4.2,'Laman',390),R(1,'Puso',260),R(2,'Isaw',260),R(2.2,'Pila',350),R(19.8,'Laman',390),R(6.8,'Pips',340),R(4.8,'Bulalo',310),R(2,'Padaitan',280)]});
try{const d=JSON.parse(localStorage.getItem('rbook1')||'null');if(d&&d.receipts)db=d}catch(e){}
const save=()=>{try{localStorage.setItem('rbook1',JSON.stringify(db))}catch(e){}};
let view='home',cur=null,last=null,priceOK=false;
const rc=()=>db.receipts.find(r=>r.id===cur);
const dueOf=r=>Math.max(0,Math.round((grand(r)-num(r.paid))*100)/100);
function owedList(){
  const m=new Map();
  [...db.receipts].filter(r=>r.done&&String(r.to||'').trim()).sort((a,b)=>a.id-b.id).forEach(r=>m.set(r.to.trim().toLowerCase(),r));
  return [...m.values()].map(r=>({name:r.to.trim(),due:dueOf(r),r})).filter(o=>o.due>0).sort((a,b)=>b.due-a.due);
}
let hq='',showAll=false;
function drawList(){
  const box=$('rl');if(!box)return;
  const t=hq.trim().toLowerCase();
  let list=[...db.receipts].sort((x,y)=>y.dt.localeCompare(x.dt)||y.id-x.id);
  if(t)list=list.filter(r=>[r.to,r.no,r.dt,...r.rows.map(x=>x.a)].some(v=>String(v||'').toLowerCase().includes(t)));
  box.innerHTML=list.length?list.map(r=>{const due=r.done?dueOf(r):0;return '<div class="li" data-id="'+r.id+'"><div><b>'+(esc(r.to)||'No name')+'</b><small>No '+esc(r.no)+' · '+esc(r.dt)+' · '+nItems(r)+(nItems(r)===1?' item':' items')+(r.done?' · ✓ ended':(badRows(r).length?' · ⚠ incomplete':' · draft'))+'</small>'+(due>0?'<small style="color:var(--acc);font-weight:700">Owes '+money(due)+'</small>':'')+'</div><b>'+money(grand(r))+'</b></div>'}).join(''):'<div class="empty">'+(t?'No receipts match.':'No receipts yet. Tap + New.')+'</div>';
  box.querySelectorAll('.li').forEach(e=>e.onclick=()=>nav('edit',+e.dataset.id));
}
const nItems=r=>r.rows.filter(x=>x.a||amt(x)).length;
const used=x=>[x.q,x.a,x.p,x.A].some(v=>String(v??'').trim()!=='');
const badRows=r=>r.rows.map((x,i)=>used(x)&&!(String(x.a||'').trim()&&num(x.q)>0&&num(x.p)>0)?i:-1).filter(i=>i>=0);
function check(){const r=rc(),b=badRows(r);if(b.length){sfx('deny');alert('Please fill in ARTICLE, QTY and PRICE on row '+b.map(i=>i+1).join(', ')+' first.');return false}return true}

/* navigation with browser history, so the Android back button works */
function nav(v,id,rp){const st={v,id};if(rp)history.replaceState(st,'','#'+v);else history.pushState(st,'','#'+v);view=v;if(id!=null)cur=id;render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{const s=e.state||{v:'home'};view=s.v;if(s.id!=null)cur=s.id;$('sh').classList.remove('o');render()});
history.replaceState({v:'home'},'','#home');
const isNative=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())};
function goHome(){closeCV();closeNP();closeDD();const m=$('mdl');if(m)m.remove();view='home';try{history.replaceState({v:'home'},'','#home')}catch(e){}render();window.scrollTo(0,0)}
const back=()=>isNative()?goHome():history.back();

function render(){
  const h=$('hd'),a=$('app');
  if(view==='home'){
    priceOK=false;
    h.innerHTML='<h1><img class="lg" src="'+LOGO+'" alt="">Beef Calculator</h1><button id="sn"></button><button id="pr">🔒 Prices</button><button id="nw">+ New</button>';
    $('pr').onclick=async()=>{if(await auth('Edit prices')){priceOK=true;sfx('unlock');nav('prices')}else sfx('deny')};$('nw').onclick=newReceipt;
    const tr=db.receipts.filter(r=>r.dt===today()),owed=owedList(),tot=owed.reduce((x,o)=>x+o.due,0),shown=showAll?owed:owed.slice(0,5);
    a.innerHTML=`<div class="card hero"><span>Customers with balance</span><b id="hb">${money(tot)}</b><small>${owed.length?owed.length+' customer'+(owed.length===1?'':'s')+' · tap a name to open':'✓ Nobody owes you right now'}</small>${shown.length?`<div class="ol">${shown.map(o=>`<div class="or" data-id="${o.r.id}"><span>${esc(o.name)}<small>No ${esc(o.r.no)} · ${esc(o.r.dt)}</small></span><b>${money(o.due)}</b></div>`).join('')}</div>`:''}${owed.length>5?`<button class="btn" id="sa" style="margin-top:8px;width:100%">${showAll?'Show less':'Show all '+owed.length}</button>`:''}</div>
    <div class="sub">Sales today <b>${money(tr.reduce((x,r)=>x+sub(r),0))}</b> · ${db.receipts.length} receipts</div>
    <input id="sq" class="sq" type="search" placeholder="🔍 Search name, receipt no. or item" value="${esc(hq)}">
    <div class="card" id="rl" style="padding:0"></div>`;
    a.querySelectorAll('.or').forEach(e=>e.onclick=()=>nav('edit',+e.dataset.id));
    if($('sa'))$('sa').onclick=()=>{showAll=!showAll;render()};
    $('sq').oninput=e=>{hq=e.target.value;drawList()};
    fit($('hb'),38,20);drawList();
  }else if(view==='prices'){
    if(!priceOK){view='home';return render()}
    h.innerHTML='<button id="bk">←</button><h1>Price list (per kg)</h1>';$('bk').onclick=back;
    a.innerHTML=`<div class="card">${db.items.map((it,i)=>`<div class="pr"><input data-i="${i}" data-f="n" value="${esc(it.n)}" placeholder="Item"><input data-i="${i}" data-f="p" data-num inputmode="decimal" style="text-align:right" value="${it.p}"><button class="x" data-del="${i}">✕</button></div>`).join('')}<div class="bar"><button class="btn" id="ai">+ Add item</button></div></div><p style="color:var(--mut);font-size:13px">These appear as quick-add buttons on every receipt.</p>`;
    a.querySelectorAll('input').forEach(i=>i.oninput=()=>{db.items[i.dataset.i][i.dataset.f]=i.dataset.f==='p'?num(i.value):i.value;save()});
    a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{db.items.splice(b.dataset.del,1);save();render()});
    $('ai').onclick=()=>{db.items.push({n:'',p:0});save();render()};
  }else{
    const r=rc();if(!r){view='home';return render()}
    while(r.rows.length<12)r.rows.push(blank());
    h.innerHTML='<button id="bk">←</button><h1>Receipt</h1><button id="sn"></button><button id="sh2">Share</button>';$('bk').onclick=back;$('sh2').onclick=share;
    a.innerHTML=`<div id="chipbox"></div>
    <div class="paper">
      <img class="plogo" src="${LOGO}" alt=""><h2>SALES RECEIPT</h2>${r.done?'<div class="stamp">✓ RECEIPT ENDED</div>':''}
      <div class="hl"><b>SOLD TO</b><input class="hw" data-m="to" value="${esc(r.to)}"><b style="margin-left:4px">DATE</b><input class="hw" data-m="dt" type="date" style="max-width:150px;font-size:14px" value="${esc(r.dt)}"></div>
      <div class="hl"><b>ADDRESS</b><input class="hw" data-m="ad" value="${esc(r.ad)}"></div>
      <table class="rc"><colgroup><col style="width:14%"><col style="width:12%"><col style="width:30%"><col style="width:17%"><col style="width:27%"></colgroup>
      <thead><tr><th>QTY</th><th>UNIT</th><th>ARTICLES</th><th>PRICE</th><th>AMOUNT</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="sum">
        <div class="sl"><b>TOTAL</b><span class="v hw" id="st"></span></div>
        <div class="sl"><b>BALANCE</b><input class="hw" data-m="bal" data-num inputmode="decimal" value="${r.bal||''}" placeholder="No balance"></div>
        <div class="nb" id="nb"></div>

      return true;
    }
    return confirm('Unlock for editing?\n\nIn the installed Android app this asks for your fingerprint or phone PIN / password.');
  }catch(e){
    const m=String((e&&(e.message||e.code))||e||'unknown error');
    if(!/cancel/i.test(m))toast('Could not verify ('+stage+'): '+m);
    return false;
  }
  finally{authBusy=false}
}
/* ---- sound effects (synthesized, no files) ---- */
let ac=null;
function tone(f,d,type,v,at,f2){
  const c=ac||(ac=new (window.AudioContext||window.webkitAudioContext)());
  if(c.state==='suspended')c.resume();
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(at||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);
}
function sfx(n){
  if(db.mute)return;
  try{({
    tap:()=>tone(1100,.045,'triangle',.07,0,700),
    add:()=>tone(520,.09,'sine',.09,0,900),
    confirm:()=>{tone(1318,.12,'sine',.1);tone(1760,.35,'sine',.09,.09);tone(2637,.5,'triangle',.04,.09)},
    unlock:()=>{tone(500,.1,'square',.04,0,700);tone(800,.16,'square',.04,.09,1000)},
    deny:()=>{tone(180,.18,'sawtooth',.07,0,120);tone(150,.2,'sawtooth',.07,.16,100)},
    del:()=>tone(500,.22,'triangle',.08,0,150)
  }[n])()}catch(e){}
}
function bindSnd(){
  const b=$('sn');if(!b)return;
  const f=()=>{b.textContent=db.mute?'🔇':'🔊'};f();
  b.onclick=()=>{db.mute=!db.mute;save();f();sfx('tap')};
}
{const r0=render;render=function(){r0();bindSnd()}}
/* ---- comfort: commas, auto-fit, keep row visible ---- */
function fc(v){if(String(v==null?'':v).trim()==='')return '';return num(v).toLocaleString('en-US',{maximumFractionDigits:2})}
function fit(el,max,min){if(!el)return;el.style.fontSize=max+'px';let z=max;while(el.scrollWidth>el.clientWidth+1&&z>min){z--;el.style.fontSize=z+'px'}}
function showEl(el,pad){
  if(!el||!el.isConnected)return;
  const hd=$('hd').offsetHeight,vv=window.visualViewport,vh=Math.min(innerHeight,vv?vv.height:innerHeight),bottom=vh-(pad||0),r=el.getBoundingClientRect();
  const d=(r.top+r.height/2)-(hd+(bottom-hd)/2);
  if(Math.abs(d)>6)window.scrollBy({top:d,behavior:'smooth'});
}
document.addEventListener('focusin',e=>{const i=e.target;if(i.matches&&i.matches('main input:not([readonly]):not([type=date])')){document.body.classList.add('kb');setTimeout(()=>showEl(i.closest('tr')||i,0),380)}});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('main input:not([readonly])')))document.body.classList.remove('kb')},200));
window.addEventListener('resize',()=>{if(view==='edit')totals()});
function updNB(r){
  const n=$('nb');if(!n)return;
  if(num(r.bal)>0){n.style.display='none';return}
  if(r.nb){n.style.display='flex';n.style.background='#e3f4e6';n.style.color='#1b6b2e';n.innerHTML='<span>✓ No balance</span>'}
  else if(r.done){n.style.display='none'}
  else{n.style.display='flex';n.style.background='#fff4d6';n.style.color='#8a5a00';n.innerHTML='<span>🔔 Reminder: any previous balance?</span><button id="nbb">No balance</button>'}
}

/* ---- end receipt + suggest a new one ---- */
function ask(html,btns){
  const old=$('mdl');if(old)old.remove();
  const m=document.createElement('div');m.className='mdl';m.id='mdl';
  m.innerHTML='<div class="box" style="text-align:center">'+html+'<div class="col"></div></div>';
  document.body.appendChild(m);
  const col=m.querySelector('.col');
  btns.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.c||'');e.textContent=b.t;e.onclick=()=>{m.remove();if(b.f)b.f()};col.appendChild(e)});
}
function endReceipt(){
  const r=rc();if(!r)return;
  if(!r.rows.some(used)){sfx('deny');toast('Add at least one item first.');return}
  const bad=badRows(r);
  if(bad.length){sfx('deny');showEl($('rows').children[bad[0]],0);toast('Fill in ARTICLE, QTY and PRICE on row '+bad.map(i=>i+1).join(', ')+' first.');return}
  if(!r.nb&&!num(r.bal)){
    sfx('add');
    ask('<div style="font-size:30px">🔔</div><div style="font-size:18px;font-weight:700;margin:6px 0">Any balance?</div><div style="color:var(--mut);font-size:14px">This receipt has no previous balance. Is that right?</div>',
      [{t:'No balance, end receipt',c:'p',f:()=>{r.nb=true;save();askPaid()}},{t:'Add a balance',f:()=>{const b=document.querySelector('[data-m=bal]');if(b){b.focus()}}}]);
    return;
  }
  askPaid();
}
function askPaid(){
  const r=rc();if(!r)return;
  if(String(r.paid==null?'':r.paid).trim()!=='')return finishReceipt();
  ask('<div style="font-size:30px">💵</div><div style="font-size:18px;font-weight:700;margin:6px 0">Payment</div><div style="color:var(--mut);font-size:14px">Grand total</div><div style="font-size:26px;font-weight:700">'+money(grand(r))+'</div><div style="color:var(--mut);font-size:14px;margin-top:4px">Did the customer pay?</div>',
    [{t:'Paid in full',c:'p',f:()=>{r.paid=String(grand(r));save();finishReceipt()}},{t:'Not paid yet (owes '+money(grand(r))+')',f:()=>{r.paid='0';save();finishReceipt()}},{t:'Enter amount paid',f:()=>{const b=document.querySelector('[data-m=paid]');if(b)b.focus()}}]);
}
function finishReceipt(){
  const r=rc();if(!r)return;
  r.rows.forEach(x=>{if(complete(x))x.ok=true});
  r.done=true;r.doneAt=Date.now();save();sfx('confirm');
  render();window.scrollTo(0,0);
  const nm=String(r.to||'').trim();
  ask('<div style="font-size:34px">✅</div><div style="font-size:19px;font-weight:700;margin:6px 0 2px">Receipt ended</div><div style="color:var(--mut);font-size:13px">No '+esc(r.no)+(nm?' · '+esc(nm):'')+'</div><div style="font-size:28px;font-weight:700;margin:10px 0 2px">'+money(grand(r))+'</div><div style="color:var(--mut);font-size:13px">Ready for the next customer? The next receipt will be No '+esc(nextNo())+'.</div>',
    [{t:'+ New receipt',c:'p',f:()=>newReceipt('',true)},...(nm?[{t:'New receipt for '+nm,f:()=>newReceipt(nm,true)}]:[]),{t:'Share this receipt',f:share},{t:'Close'}]);
}

/* ---- customer view ---- */
const m0=n=>'₱'+(+n||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const fq=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:3});
function openCV(){
  const r=rc();if(!r)return;
  closeNP();closeDD();closeCV();
  const o=document.createElement('div');o.id='cv';
  o.innerHTML='<div class="cvh"><div style="display:flex;align-items:center;gap:10px"><img class="lg2" src="'+LOGO+'" alt=""><div><div class="cvt">'+(esc(r.to)||'Customer')+'</div><div class="cvs">Receipt No '+esc(r.no)+' · '+esc(r.dt)+'</div></div></div><button id="cvx">✕ Close</button></div><div class="cvl" id="cvl"></div><div class="cvf" id="cvf"></div>';
  document.body.appendChild(o);
  $('cvx').onclick=closeCV;
  renderCV();sfx('add');
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{o._w=w}).catch(()=>{})}catch(e){}
}
function closeCV(){const o=$('cv');if(!o)return;try{if(o._w)o._w.release()}catch(e){}o.remove()}
function renderCV(){
  const o=$('cv'),r=rc();if(!o||!r)return;
  const rs=r.rows.filter(x=>complete(x)),kg=rs.reduce((s,x)=>s+num(x.q),0),bal=num(r.bal);
  $('cvl').innerHTML=rs.length?rs.map((x,i)=>'<div class="cvr"><div class="cvn">'+(i+1)+'</div><div class="cvm"><div class="cva">'+esc(x.a)+'</div><div class="cvq">'+(x.s==='a'?'≈ ':'')+fq(num(x.q))+' '+esc(x.u||'kg')+' × '+m0(num(x.p))+'</div></div><div class="cvp">'+(x.ok?'<span class="cvk">✓</span>':'')+m0(amt(x))+'</div></div>').join(''):'<div class="cve">No items yet</div>';
  $('cvf').innerHTML='<div class="cvi">'+rs.length+' item'+(rs.length===1?'':'s')+' · '+fq(kg)+' kg total'+(rs.some(x=>x.ok)?' · ✓ confirmed':'')+'</div><div class="cvx"><span>Total</span><b id="cvs">'+money(sub(r))+'</b></div>'+(bal>0?'<div class="cvx"><span>Previous balance</span><b>'+money(bal)+'</b></div>':'')+'<div class="cvx cvg"><span>GRAND TOTAL</span><b id="cvg">'+money(grand(r))+'</b></div>'+(num(r.paid)>0?'<div class="cvx"><span>Paid</span><b>'+money(num(r.paid))+'</b></div><div class="cvx"><span>Balance left</span><b>'+money(dueOf(r))+'</b></div>':'');
  fit($('cvg'),40,18);fit($('cvs'),26,14);
  const l=$('cvl');l.scrollTop=l.scrollHeight;
}

/* ---- Android back button ---- */
let lastBack=0;
function exitApp(){const C=window.Capacitor;try{const A=C.Plugins&&C.Plugins.App;if(A&&A.exitApp)return A.exitApp();return C.nativePromise('App','exitApp',{})}catch(e){}}
function onBack(){
  if($('cv')){closeCV();return}
  const m=$('mdl');if(m){m.remove();return}
  if(npEl){closeNP();return}
  if($('sh').classList.contains('o')){$('sh').classList.remove('o');return}
  if($('ddm')){closeDD();return}
  if(view!=='home'){goHome();return}
  const n=Date.now();
  if(n-lastBack<2200)exitApp();else{lastBack=n;toast('Press back again to exit')}
}
(function(){
  const C=window.Capacitor;if(!isNative())return;
  try{
    if(!(C.isPluginAvailable&&C.isPluginAvailable('App')))return;
    const A=C.Plugins&&C.Plugins.App;
    if(A&&typeof A.addListener==='function'){A.addListener('backButton',onBack);return}
    if(typeof C.nativeCallback==='function')C.nativeCallback('App','addListener',{eventName:'backButton'},onBack);
  }catch(e){}
})();
render();cshow();
</script>
